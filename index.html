<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 협업 개발 실습</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="card hero">

      <h1>AI 협업 개발 실습</h1>
      <p class="lead">첫 번째 웹 앱입니다.</p>
      <hr>
      <p class="helper-text">아래에 이름을 입력하고 버튼을 눌러 실습을 시작해보세요.</p>

      <!-- 이름 입력창 -->
      <label for="nameInput" class="input-label">이름</label>
      <input type="text" id="nameInput" placeholder="이름을 입력하세요">

      <!-- 실습 시작 버튼 -->
      <button id="startButton">실습 시작</button>

      <!-- 결과 메시지가 표시되는 영역 -->
      <div id="resultArea" class="message-area"></div>

    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
